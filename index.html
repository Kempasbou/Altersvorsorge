      if (new Date() > new Date(p.exp + 'T23:59:59')) { msg.textContent = 'Dieser Link ist abgelaufen. Bitte fordern Sie einen neuen an.'; return; }
      document.open(); document.write(p.html); document.close();
    }).catch(function () { msg.textContent = 'Der Schlüssel passt nicht. Bitte den vollständigen Link aus der E-Mail verwenden.'; });
  }
  document.getElementById('go').addEventListener('click', function () { open_(input.value); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') open_(input.value); });
  var m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if (m) open_(m[1]);
})();
</script>
</body>
</html>
